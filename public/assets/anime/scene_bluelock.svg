<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#0c1e4a"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="450" fill="url(#pitch)"/>
  <!-- Stadium Floodlights -->
  <circle cx="110" cy="65" r="22" fill="#e0f2fe" opacity="0.8"/>
  <circle cx="490" cy="65" r="22" fill="#e0f2fe" opacity="0.8"/>
  <!-- Football Field Lines -->
  <path d="M0 320 L600 320" stroke="#34d399" stroke-width="3" opacity="0.5"/>
  <ellipse cx="300" cy="365" rx="140" ry="36" fill="none" stroke="#34d399" stroke-width="3" opacity="0.45"/>
  <!-- Blue Aura Chain & Soccer Ball -->
  <circle cx="300" cy="210" r="135" fill="url(#glow)"/>
  <circle cx="300" cy="210" r="78" fill="#ffffff" stroke="#0f172a" stroke-width="6"/>
  <polygon points="300,175 332,198 320,235 280,235 268,198" fill="#0f172a"/>
  <line x1="300" y1="175" x2="300" y2="132" stroke="#0f172a" stroke-width="5"/>
  <line x1="332" y1="198" x2="372" y2="185" stroke="#0f172a" stroke-width="5"/>
  <line x1="268" y1="198" x2="228" y2="185" stroke="#0f172a" stroke-width="5"/>
  <line x1="320" y1="235" x2="350" y2="272" stroke="#0f172a" stroke-width="5"/>
  <line x1="280" y1="235" x2="250" y2="272" stroke="#0f172a" stroke-width="5"/>
  <!-- Electric Blue Striker Streak -->
  <path d="M85 260 Q185 215 235 225" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M365 200 Q445 180 520 155" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
</svg>
