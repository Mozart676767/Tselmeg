<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="forest" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#090d1a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#forest)"/>
  <!-- Moon -->
  <circle cx="480" cy="85" r="46" fill="#f1f5f9" opacity="0.88"/>
  <!-- Checkered Green & Black Pattern (iconic haori) -->
  <g opacity="0.88" transform="translate(65,280)">
    <rect x="0" y="0" width="44" height="44" fill="#10b981"/>
    <rect x="44" y="0" width="44" height="44" fill="#0f172a"/>
    <rect x="88" y="0" width="44" height="44" fill="#10b981"/>
    <rect x="0" y="44" width="44" height="44" fill="#0f172a"/>
    <rect x="44" y="44" width="44" height="44" fill="#10b981"/>
    <rect x="88" y="44" width="44" height="44" fill="#0f172a"/>
  </g>
  <!-- Water Breathing Katana Slash -->
  <path d="M90 310 C190 120 390 100 520 210 C420 155 240 165 130 330 Z" fill="url(#water)"/>
  <path d="M110 290 C220 140 380 130 490 215" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round"/>
  <!-- Katana Blade -->
  <line x1="175" y1="275" x2="455" y2="125" stroke="#0f172a" stroke-width="12" stroke-linecap="round"/>
  <line x1="175" y1="275" x2="455" y2="125" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <!-- Wisteria Purple Flowers -->
  <g fill="#c084fc" opacity="0.9">
    <circle cx="110" cy="35" r="14"/><circle cx="110" cy="58" r="12"/><circle cx="110" cy="78" r="9"/>
    <circle cx="145" cy="28" r="12"/><circle cx="145" cy="48" r="10"/><circle cx="145" cy="65" r="8"/>
  </g>
</svg>
